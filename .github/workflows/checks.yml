name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Check skill resources and synthetic documents
        run: python -m unittest discover -s tests -v

  reference-render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install reference dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-crosextra-carlito fonts-liberation
          npm ci --prefix vendor/claude-resume-generator
          python -m pip install -r vendor/claude-resume-generator/requirements.txt
      - name: Reproduce the fictional reference and test the verified entry point
        env:
          RESUME_RUN_CLAUDE_TESTS: "1"
        run: |
          python -m unittest discover -s tests -p test_claude_render.py -v
          python -m unittest discover -s tests -p test_verified_resume.py -v
      - name: Build the fictional sample through the public entry point
        run: |
          python scripts/build_verified_resume.py --input vendor/claude-resume-generator/input/sample_resume.json --output private/sample.pdf --qa-dir private/sample-qa
      - uses: actions/upload-artifact@v4
        with:
          name: reference-verification
          path: |
            private/sample.pdf
            private/sample-qa/verification.json
            private/sample-qa/fonts.txt
            private/sample-qa/page-*.png
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create a private build-context canary
        run: |
          mkdir -p private
          touch private/do-not-copy-into-image
      - name: Build the public image and its reference self-test
        run: docker build --platform linux/amd64 -t resume-builder .
      - name: Confirm the image excludes the private build context
        run: docker run --rm --network none --entrypoint sh resume-builder -c 'test ! -e /opt/resume-builder/private/do-not-copy-into-image'
      - name: Generate the fictional sample without network access
        run: |
          cp vendor/claude-resume-generator/input/sample_resume.json private/candidate.json
          docker run --rm --platform linux/amd64 --network none --user "$(id -u):$(id -g)" --mount "type=bind,source=$(pwd)/private,target=/work" resume-builder --input /work/candidate.json --output /work/resume.pdf --qa-dir /work/qa
      - name: Check released files and reject invalid input
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('private/qa/verification.json').read_text())
          assert report['status'] == 'passed'
          assert report['full_text_fragments'] == 56
          assert report['visual_inspection'] == 'not_checked'
          assert Path('private/resume.pdf').is_file()
          assert not Path('private/resume.docx').exists()
          assert Path('private/qa/page-1.png').is_file()
          value = json.loads(Path('private/candidate.json').read_text())
          value['unsupported_claim'] = 'Must not disappear silently'
          Path('private/invalid.json').write_text(json.dumps(value))
          PY
          set +e
          docker run --rm --network none --user "$(id -u):$(id -g)" --mount "type=bind,source=$(pwd)/private,target=/work" resume-builder --input /work/invalid.json --output /work/invalid.pdf --qa-dir /work/invalid-qa > private/blocked.json
          result=$?
          set -e
          test "$result" -eq 2
          test ! -e private/invalid.pdf
          test ! -e private/invalid-qa
      - uses: actions/upload-artifact@v4
        with:
          name: docker-verification
          path: |
            private/resume.pdf
            private/qa/verification.json
            private/qa/fonts.txt
            private/qa/page-*.png
            private/blocked.json
          retention-days: 7
